name: Release

# Keeps one "Release Critiqs" pull request up to date with the release notes
# merged to main. Every Critiqs package is versioned together, to one shared
# version. It never merges, approves, publishes, or deploys; see
# docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pull-request
  cancel-in-progress: false

jobs:
  release-pull-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update the release pull request
      actions: write # start CI on the release branch
    env:
      BRANCH: changeset-release/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Version
        run: bun scripts/release.ts version
      - name: Open or update the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_git() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
            git "$@"
          }
          # Only this repository's own branch is the release pull request; a
          # fork's branch can have the same name.
          pr=$(gh pr list --head "$BRANCH" --base main --state open --limit 100 --json number,isCrossRepository \
            | jq -r '[.[] | select(.isCrossRepository == false)][0].number // empty')
          # Assigned first so a failing git stops the job instead of reading as "no changes".
          changes=$(git status --porcelain)
          if [ -z "$changes" ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --comment "main has no unreleased release notes, so this release is no longer needed."
            fi
            exit 0
          fi

          version=$(bun scripts/release.ts shared-version)
          title="Release Critiqs $version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Release Critiqs $version"
          bun scripts/release.ts pr-body > "$RUNNER_TEMP/release-body.md"

          # Push only when the generated release differs from the current one.
          # A missing branch (ls-remote exit 2) is created; any other failure
          # to read or fetch it stops the job, so an outage never reads as "no
          # branch yet". Each commit is resolved outside the comparison, so a
          # failing git stops the job instead of two empty values reading as
          # equal. The push is leased on the commit observed here, so a branch
          # that moved meanwhile is never overwritten.
          listed=0
          auth_git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null || listed=$?
          if [ "$listed" = 2 ]; then
            observed=""
          elif [ "$listed" = 0 ]; then
            auth_git fetch --quiet origin "refs/heads/$BRANCH"
            observed=$(git rev-parse FETCH_HEAD)
          else
            echo "::error::Couldn't read $BRANCH from origin (git ls-remote exited $listed)."
            exit 1
          fi
          same=false
          if [ -n "$observed" ]; then
            fetched_tree=$(git rev-parse "$observed^{tree}")
            fetched_parent=$(git rev-parse "$observed^")
            tree=$(git rev-parse 'HEAD^{tree}')
            parent=$(git rev-parse 'HEAD^')
            if [ "$fetched_tree" = "$tree" ] && [ "$fetched_parent" = "$parent" ]; then
              same=true
            fi
          fi
          if [ "$same" = true ]; then
            echo "The release branch already holds this release."
            head=$observed
          else
            # An empty lease value means the branch must still not exist.
            auth_git push --force-with-lease="refs/heads/$BRANCH:$observed" origin "HEAD:refs/heads/$BRANCH"
            head=$(git rev-parse HEAD)
          fi

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/release-body.md"
          fi

          # Pushes made with this workflow's token start no push workflows, and
          # its pull request events wait for approval, so start CI explicitly
          # for the release branch's commit unless a run was already started
          # for it, including by an earlier attempt that then failed.
          runs=$(gh run list --workflow ci.yml --event workflow_dispatch --branch "$BRANCH" --commit "$head" --limit 1 --json databaseId \
            | jq 'length')
          if [ "$runs" = 0 ]; then
            gh workflow run ci.yml --ref "$BRANCH"
          else
            echo "CI already started for $head."
          fi
