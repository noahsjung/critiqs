name: Older packages

# Every supported published package version (see "Support window" in
# docs/technical-direction.md), installed from its registry, against the
# current Convex backend and self-hosted server. It needs the registries, so
# it is not one of the checks every pull request must pass: it runs on pull
# requests and pushes that change backend code or the scripts the check
# runs (and the scripts those import), every day (a new release can
# enter the window, an old one leave it), and on demand.

on:
  pull_request:
    paths:
      - "packages/backend/**"
      - "packages/server/**"
      - "packages/core/**"
      - "scripts/check-older-packages.ts"
      - "scripts/support-window.ts"
      - "scripts/consumer-kit.ts"
      - "scripts/package-tarball.ts"
      - "scripts/publish.ts"
      - "scripts/release.ts"
      - "scripts/shipped-changes.ts"
      - ".github/workflows/older-packages.yml"
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - "packages/server/**"
      - "packages/core/**"
      - "scripts/check-older-packages.ts"
      - "scripts/support-window.ts"
      - "scripts/consumer-kit.ts"
      - "scripts/package-tarball.ts"
      - "scripts/publish.ts"
      - "scripts/release.ts"
      - "scripts/shipped-changes.ts"
      - ".github/workflows/older-packages.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: older-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  older-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-older-packages.ts
        env:
          CRITIQS_EVIDENCE_DIR: ${{ runner.temp }}/older-packages
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: older-packages-screenshots
          path: ${{ runner.temp }}/older-packages
          if-no-files-found: ignore
