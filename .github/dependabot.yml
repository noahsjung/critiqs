# Weekly, grouped dependency updates. Dependabot's bun support covers version
# updates only; security alerts still appear in the Security tab.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
      - /site-src
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # One pull request for every minor and patch update.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # Major updates are grouped too, but kept apart: they can break hosts.
      major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
