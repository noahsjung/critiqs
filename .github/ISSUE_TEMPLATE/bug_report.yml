name: Bug report
description: Something in Critiqs doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't open an issue: [report it privately](https://github.com/noahsjung/critiqs/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, or a link to a repository that shows the problem.
      placeholder: |
        1. Add <Critiqs /> to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Critiqs package and version
      placeholder: "critiqs-react 0.3.0"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Critiqs Cloud
        - Team-owned Convex deployment
        - Self-hosted (Node or Bun server with SQLite)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Component (toolbar, sidebar, pins, commenting)
        - Setup or the critiqs CLI
        - MCP server or coding agents
        - Mockup mode or AI
        - Backend or sign-in
        - Docs or the critiqs.app site
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Framework and version (Vite, Next.js, ...), React version, browser, OS, Node.js or Bun version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console errors, CLI output, or screenshots. Remove any keys or tokens first.
